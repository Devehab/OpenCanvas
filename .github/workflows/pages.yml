name: Landing page

# Builds the landing page (site/ → _site/, one page per language) and
# publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only the default branch publishes; other branches skip the job.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled::Open the repository's Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: node scripts/site/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
