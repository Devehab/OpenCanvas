name: Install test

# Answers one question: does the one-line install work on a computer where
# nothing has ever been installed (no Node.js, no pnpm, no Git)?
#
#   macOS / Linux:  curl -fsSL https://raw.githubusercontent.com/Devehab/OpenCanvas/HEAD/install.sh | bash
#   Windows:        irm https://raw.githubusercontent.com/Devehab/OpenCanvas/HEAD/install.ps1 | iex
#
# On fresh GitHub machines (macOS, Ubuntu, Windows) and bare Linux images, it
# installs, then checks start, stop, status, restart, installing again and
# uninstall. By default it tests the installer and the app of this commit;
# with `source: published` it tests exactly what a stranger gets from the
# latest release (the Release workflow runs it that way after publishing).

on:
  push:
    paths:
      - install.sh
      - install.ps1
      - packaging/**
      - scripts/build-bundle.sh
      - scripts/test-install*
      - scripts/s3-test-server.py
      - .github/workflows/install-test.yml
  workflow_dispatch:
    inputs:
      source:
        description: 'What to install: "commit" (build this commit) or "published" (the latest release)'
        type: choice
        options: [commit, published]
        default: commit
  workflow_call:
    inputs:
      source:
        type: string
        default: published
  schedule:
    - cron: '17 6 * * 1' # weekly: catch a published release that stopped installing

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.ref }}-${{ inputs.source || 'commit' }}
  cancel-in-progress: true

env:
  # A scheduled run tests the published release.
  SOURCE: ${{ inputs.source || (github.event_name == 'schedule' && 'published') || 'commit' }}

jobs:
  bundle:
    name: Build the app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        if: env.SOURCE == 'commit'
      - uses: pnpm/action-setup@v4
        if: env.SOURCE == 'commit'
      - uses: actions/setup-node@v5
        if: env.SOURCE == 'commit'
        with:
          node-version-file: .nvmrc
      - name: Build
        if: env.SOURCE == 'commit'
        run: scripts/build-bundle.sh dist
      - name: Nothing to build (testing the published release)
        if: env.SOURCE != 'commit'
        run: mkdir -p dist && echo published > dist/SOURCE
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/
          retention-days: 3

  hosts:
    name: ${{ matrix.os }}
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - name: Install and check (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target=dist/opencanvas.tar.gz
          [ "$SOURCE" = published ] && target=published
          scripts/test-install.sh "$target"
      - name: Install and check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = if ($env:SOURCE -eq 'published') { 'published' } else { 'dist/opencanvas.tar.gz' }
          ./scripts/test-install.ps1 $target
      - name: Server log
        if: failure()
        shell: bash
        run: |
          cat "$HOME/.opencanvas/logs/server.log" 2>/dev/null || true
          cat "${LOCALAPPDATA:-/nonexistent}/OpenCanvas/logs/server.log" 2>/dev/null || true

  # Bare images with only bash, curl and tar added: no Node.js, no systemd.
  containers:
    name: ${{ matrix.image }}
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'fedora:latest', 'alpine:latest']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - name: Install and check
        run: |
          target=/w/dist/opencanvas.tar.gz
          [ "$SOURCE" = published ] && target=published
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh -c "
            if command -v apk >/dev/null; then apk add --no-cache bash curl tar gzip ca-certificates >/dev/null
            elif command -v apt-get >/dev/null; then apt-get update -qq >/dev/null && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bash curl tar gzip ca-certificates >/dev/null
            elif command -v dnf >/dev/null; then command -v curl >/dev/null || dnf install -y -q curl; dnf install -y -q tar gzip >/dev/null
            fi
            bash scripts/test-install.sh $target
          "

  # The storage question against a real S3 server: wrong keys fall back to
  # this computer, right keys connect, a reinstall finds the library.
  cloud:
    name: cloud setup on ${{ matrix.os }}
    needs: bundle
    if: ${{ (inputs.source || 'commit') == 'commit' && github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "moto[server]"
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - name: Install and check (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: PYTHON=python scripts/test-install-cloud.sh dist/opencanvas.tar.gz
      - name: Install and check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install-cloud.ps1 dist/opencanvas.tar.gz
