name: Release

# Publishes a version of OpenCanvas:
#   1. the app bundle (opencanvas.tar.gz) as a GitHub release, which the
#      one-line installers download (install.sh, install.ps1);
#   2. then checks that the one-line install works on fresh machines;
#   3. for version tags pushed with git, also the Docker image on GHCR.
#
# Publish from the Actions tab: Release → Run workflow → enter a version
# such as v0.1.0. Or push a tag: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

jobs:
  bundle:
    name: App bundle and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Version
        id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::The version must look like v0.1.0"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build the bundle
        run: scripts/build-bundle.sh dist "${{ steps.v.outputs.tag }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          Nothing else is needed: the installer brings its own Node.js, runs OpenCanvas in the background on port 4790 and starts it with the computer.

          **macOS and Linux** (Terminal):

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Devehab/OpenCanvas/HEAD/install.sh | bash
          ```

          **Windows** (PowerShell):

          ```powershell
          irm https://raw.githubusercontent.com/Devehab/OpenCanvas/HEAD/install.ps1 | iex
          ```

          Then open http://localhost:4790. Stop it with `opencanvas stop`, start it with `opencanvas start`, update with `opencanvas update`, remove with `opencanvas uninstall`.

          The installer asks where to keep your work: on this computer only, or also in your own cloud storage (Cloudflare R2, Amazon S3 or another S3-compatible service). Change it any time with `opencanvas cloud`.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/opencanvas.tar.gz dist/opencanvas.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" dist/opencanvas.tar.gz dist/opencanvas.tar.gz.sha256 \
              --target "$GITHUB_SHA" --title "OpenCanvas $TAG" --notes-file notes.md
          fi

  install-test:
    name: Install test
    needs: bundle
    uses: ./.github/workflows/install-test.yml
    with:
      source: published

  image:
    name: Docker image
    # Only for tags pushed with git; the version comes from the tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
